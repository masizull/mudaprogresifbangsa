<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Mode | Yayasan Muda Progresif Bangsa</title>
  <link rel="icon" type="image/png" href="./logo/LOGO MPB - WARNA.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF5500',
              'orange-hover': '#E04B00',
              blue: '#0066FF',
              'blue-hover': '#0052CC',
              navy: '#031B3A',
              'navy-light': '#08254D',
              'slate-bg': '#F8FAFC',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'ambient': '0 4px 20px -2px rgba(18, 25, 38, 0.05)',
            'ambient-hover': '0 12px 32px -4px rgba(3, 27, 58, 0.09)',
            'cta-orange': '0 4px 14px 0 rgba(255, 85, 0, 0.28)',
            'cta-blue': '0 4px 14px 0 rgba(0, 102, 255, 0.25)',
          },
          borderRadius: {
            'card': '12px',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          },
          animation: {
            marquee: 'marquee 28s linear infinite',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-brand-slate-bg text-brand-navy antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
