<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akademi Progresif — Motion Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ff;color:#132b54;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:min(900px,100%)}h1{font-size:22px}p{line-height:1.6}.stage{position:relative;background:white;border-radius:20px;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;box-shadow:0 18px 70px #173b7314}.crop{width:76%;aspect-ratio:1.48;overflow:hidden;position:relative;animation:reveal 5s cubic-bezier(.2,.7,.2,1) infinite}.crop img{position:absolute;width:162%;max-width:none;left:0;top:0}.line{position:absolute;bottom:9%;height:5px;background:#ff861c;border-radius:5px;animation:line 5s ease infinite}button{border:0;background:#2864f0;color:white;padding:12px 22px;border-radius:10px;font:inherit;cursor:pointer}small{display:block;margin-top:14px;line-height:1.6} @keyframes reveal{0%,8%{opacity:0;transform:translateY(24px) scale(.94);clip-path:inset(100% 0 0 0)}35%,82%{opacity:1;transform:none;clip-path:inset(0)}100%{opacity:0;transform:none;clip-path:inset(0)}}@keyframes line{0%,12%{width:0;opacity:0}40%,80%{width:90px;opacity:1}100%{width:0;opacity:0}}@media(prefers-reduced-motion:reduce){.crop,.line{animation:none}.line{width:90px}}
</style><main><h1>Akademi Progresif · Motion Preview</h1><p>Reveal naik untuk pembuka video kelas, presentasi, dan pengenalan duta. Siklus 5 detik.</p><div class="stage"><div class="crop"><img src="Konsep_Logo.png" alt="Logo Akademi Progresif berbentuk lipatan A berwarna biru dan jingga"></div><div class="line"></div></div><p><button onclick="document.querySelectorAll('.crop,.line').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''})">Putar ulang</button></p><small>Pratinjau HTML dengan gambar konsep. Belum berupa MP4 atau animasi lipatan vektor. Warna pada gambar konsep masih memiliki gradasi halus.</small></main></html>
